<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 55" width="420" height="70">
 <defs>
<linearGradient id="lg" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e07848"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="wg" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e07848"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e07848"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e07848"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
 </defs>

 <!-- ====== ICON ====== -->
 <g transform="translate(2, 2)">
   <!-- Outer vault ring -->
   <circle cx="14" cy="30" r="13" fill="none" stroke="url(#lg)" stroke-width="2"/>
   <!-- Inner vault ring -->
   <circle cx="14" cy="30" r="10.5" fill="none" stroke="url(#lg)" stroke-width="1" opacity=".45"/>

   <!-- Vault door spokes -->
   <g stroke="url(#lg)" stroke-width=".8" opacity=".3" stroke-linecap="round">
     <line x1="14" y1="17" x2="14" y2="20"/>
     <line x1="14" y1="40" x2="14" y2="43"/>
     <line x1="1" y1="30" x2="4" y2="30"/>
     <line x1="24" y1="30" x2="27" y2="30"/>
     <line x1="4.8" y1="20.8" x2="7" y2="23"/>
     <line x1="21" y1="37" x2="23.2" y2="39.2"/>
     <line x1="23.2" y1="20.8" x2="21" y2="23"/>
     <line x1="7" y1="37" x2="4.8" y2="39.2"/>
   </g>

   <!-- Corrected W / web arcs -->
   <path d="M6 24 C8 24, 9 30, 10 32 C11.5 34.5, 12.5 28, 14 28 C15.5 28, 16.5 34.5, 18 32 C19 30, 20 24, 22 24"
         fill="none" stroke="url(#wg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

   <!-- Web nodes -->
<circle cx="10" cy="32" r=".85" fill="#5eead4"/>
    <circle cx="18" cy="32" r=".85" fill="#5eead4"/>
    <circle cx="14" cy="28" r=".85" fill="#5eead4"/>

   <!-- Vault crank -->
   <circle cx="14" cy="17.5" r="1.3" fill="none" stroke="url(#lg)" stroke-width="1"/>
   <line x1="14" y1="18.8" x2="14" y2="20" stroke="url(#lg)" stroke-width="1" stroke-linecap="round"/>
 </g>

 <!-- ====== WORDMARK ====== -->
 <text x="36" y="36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
       font-size="26" font-weight="700" letter-spacing="-0.5" fill="url(#tg)">
   WebVault
 </text>

 <!-- ====== TAGLINE ====== -->
 <text x="36" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
       font-size="11" font-weight="400" letter-spacing="1.5" fill="url(#sub)">
   ARCHIVE · CAPTURE · REPLAY
 </text>
</svg>