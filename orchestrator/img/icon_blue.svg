<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0070b8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e0ff"/>
      <stop offset="100%" stop-color="#005fa3"/>
    </linearGradient>
  </defs>

  <!-- Outer vault ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#ring)" stroke-width="2.4"/>

  <!-- Inner vault ring -->
  <circle cx="16" cy="16" r="11.2" fill="none" stroke="url(#ring)" stroke-width="1.2" opacity=".5"/>

  <!-- Vault door spokes -->
  <g stroke="url(#ring)" stroke-width="1" opacity=".35" stroke-linecap="round">
    <line x1="16" y1="2" x2="16" y2="5.5"/>
    <line x1="16" y1="26.5" x2="16" y2="30"/>
    <line x1="2" y1="16" x2="5.5" y2="16"/>
    <line x1="26.5" y1="16" x2="30" y2="16"/>
    <line x1="6.1" y1="6.1" x2="8.6" y2="8.6"/>
    <line x1="23.4" y1="23.4" x2="25.9" y2="25.9"/>
    <line x1="25.9" y1="6.1" x2="23.4" y2="8.6"/>
    <line x1="8.6" y1="23.4" x2="6.1" y2="25.9"/>
  </g>

  <!-- Corrected W shape -->
  <path d="M8 10 C10 10, 11 16, 12 18 C13.5 20.5, 14.5 14, 16 14 C17.5 14, 18.5 20.5, 20 18 C21 16, 22 10, 24 10"
        fill="none" stroke="url(#fg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Web nodes on the W -->
  <circle cx="12" cy="18" r="1" fill="#00d4ff"/>
  <circle cx="20" cy="18" r="1" fill="#00d4ff"/>
  <circle cx="16" cy="14" r="1" fill="#00d4ff"/>

  <!-- Vault crank / handle -->
  <circle cx="16" cy="3" r="1.5" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
  <line x1="16" y1="4.5" x2="16" y2="5.5" stroke="url(#ring)" stroke-width="1.2" stroke-linecap="round"/>
</svg>