[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["orchestrator", "tests"]
exclude = ["orchestrator/img"]
extraPaths = ["orchestrator"]
reportMissingTypeStubs = false
